# quotation marks: ”{0}”
DATASTORE_INITIALIZE_ERROR = Ett fel uppstod när datalagret skulle initieras.
DATASTORE_INITIALIZE_NOTICE = Datalagret initierat.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = SQLite-datalagret är redan initierat.
DATASTORE_CREATE_TABLE_ERROR = Ett fel uppstod när tabellen ”{0}” skapades i Sqlite-datalagret.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Ett fel uppstod när tabellen ”chest” skapades i Sqlite-datalagret.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Ett fel uppstod när tabellen ”block” skapades i Sqlite-datalagret.
DATASTORE_CLOSE_CONNECTION_ERROR = Ett fel uppstod när SQLite-datalagrets anslutning stängdes.
DATASTORE_CLOSE_CONNECTION_NOTICE = SQLite-datalagrets anslutning stängdes.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Ett fel uppstod vid försök att aktivera främmande nycklar i SQLIte-datalagret.

SCHEMA_UP_TO_DATE_NOTICE = SQLite-datalagrets schema är uppdaterat.
SCHEMA_VERSION_NOTICE = Schemaversion upptäckt: {0}
SCHEMA_VERSION_ERROR = Kunde inte läsa schemaversionen för SQLite-datalagret.
SCHEMA_UPDATE_ERROR = Ett fel uppstod vid uppdatering av databasens poster i SQLite-datalagret under schemamigrering.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} dödsdatabasens poster migrerades till det aktuella schemat i SQLite-datalagret.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} databasens blockposter migrerades till det aktuella schemat i SQLite-datalagret.

TABLE_INSERT_BLOCK_ERROR = Ett fel uppstod när ett dödsdatabasens block infogades i SQLite-datalagret.
TABLE_INSERT_CHEST_ERROR = Ett fel uppstod när en DeathChest infogades i SQLite-datalagret.

TABLE_SELECT_ALL_BLOCKS_ERROR = Ett fel uppstod när alla blockposter skulle väljas från SQLite-datalagret.
TABLE_SELECT_ALL_CHESTS_ERROR = Ett fel uppstod när alla blockposter skulle väljas från SQLite-datalagret.
TABLE_SELECT_CHEST_COUNT_ERROR = Ett fel uppstod när ett antal blockposter skulle hämtas från SQLite-datalagret.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Världsnamnet ”{0}” matchar inte en inläst värld på servern. Hoppa över post för migrering.

TABLE_DELETE_BLOCK_ERROR = Ett fel uppstod när en blockpost skulle raderas från SQLite-datalagret.
TABLE_DELETE_CHEST_ERROR = Ett fel uppstod när en blockpost skulle raderas från SQLite-datalagret.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} föräldralösa kistor i värld {1} har tagits bort.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Ett fel uppstod när föräldralösa kistor skulle tas bort från datalagret.
