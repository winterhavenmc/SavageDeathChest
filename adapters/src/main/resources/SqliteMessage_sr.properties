# quotation marks: ’{0}’
DATASTORE_INITIALIZE_ERROR = Дошло је до грешке приликом покушаја иницијализације складишта података.
DATASTORE_INITIALIZE_NOTICE = Складиште података је иницијализовано.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = SQLite складиште података је већ иницијализовано.
DATASTORE_CREATE_TABLE_ERROR = Дошло је до грешке приликом креирања табеле ’{0}’ у Sqlite складишту података.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Дошло је до грешке приликом креирања табеле ’chest’ у Sqlite складишту података.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Дошло је до грешке приликом креирања табеле ’block’ у Sqlite складишту података.
DATASTORE_CLOSE_CONNECTION_ERROR = Дошло је до грешке приликом затварања SQLite везе са складиштем података.
DATASTORE_CLOSE_CONNECTION_NOTICE = SQLite веза са складиштем података је затворена.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Дошло је до грешке приликом покушаја омогућавања страних кључева у SQLite складишту података.

SCHEMA_UP_TO_DATE_NOTICE = Шема SQLite складишта података је ажурирана.

SCHEMA_VERSION_NOTICE = Детектована верзија шеме: {0}
SCHEMA_VERSION_ERROR = Није могуће прочитати верзију шеме за SQLite складиште података.
SCHEMA_UPDATE_ERROR = Дошло је до грешке приликом ажурирања записа о сандуцима у SQLite складишту података током миграције шеме.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} записа о сандуцима смрти мигрирало је у тренутну шему у SQLite складишту података.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} записа о блоковима сандука мигрирало је у тренутну шему у SQLite складишту података.

TABLE_INSERT_BLOCK_ERROR = Дошло је до грешке приликом уметања блока сандука смрти у SQLite складиште података.
TABLE_INSERT_CHEST_ERROR = Дошло је до грешке приликом уметања ковчега смрти у SQLite складиште података.

TABLE_SELECT_ALL_BLOCKS_ERROR = Дошло је до грешке приликом покушаја одабира свих блок записа из SQLite складишта података.
TABLE_SELECT_ALL_CHESTS_ERROR = Дошло је до грешке приликом покушаја одабира свих записа ковчега из SQLite складишта података.
TABLE_SELECT_CHEST_COUNT_ERROR = Дошло је до грешке приликом покушаја преузимања броја записа ковчега из SQLite складишта података.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Назив света ’{0}’ не одговара учитаном свету на серверу. Прескачем запис за миграцију.

TABLE_DELETE_BLOCK_ERROR = Дошло је до грешке приликом покушаја брисања блок записа из SQLite складишта података.
TABLE_DELETE_CHEST_ERROR = Дошло је до грешке приликом покушаја брисања записа ковчега из SQLite складишта података.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} осиротелих ковчега у свету {1} ​​је уклоњено.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Дошло је до грешке приликом покушаја брисања осиротелих ковчега из складишта података.
