# quotation marks: „{0}“
DATASTORE_INITIALIZE_ERROR = Beim Versuch, den Datenspeicher zu initialisieren, ist ein Fehler aufgetreten.
DATASTORE_INITIALIZE_NOTICE = Datenspeicher initialisiert.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = Der SQLite-Datenspeicher ist bereits initialisiert.
DATASTORE_CREATE_TABLE_ERROR = Beim Erstellen der Tabelle „{0}“ im SQLite-Datenspeicher ist ein Fehler aufgetreten.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Beim Erstellen der Tabelle „Chest“ im SQLite-Datenspeicher ist ein Fehler aufgetreten.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Beim Erstellen der Tabelle „Block“ im SQLite-Datenspeicher ist ein Fehler aufgetreten.
DATASTORE_CLOSE_CONNECTION_ERROR = Beim Schließen der SQLite-Datenspeicherverbindung ist ein Fehler aufgetreten.
DATASTORE_CLOSE_CONNECTION_NOTICE = SQLite-Datenspeicherverbindung geschlossen.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Beim Versuch, Fremdschlüssel im SQLIte-Datenspeicher zu aktivieren, ist ein Fehler aufgetreten.

SCHEMA_UP_TO_DATE_NOTICE = Das SQLite-Datenspeicherschema ist auf dem neuesten Stand.
SCHEMA_VERSION_NOTICE = Schemaversion erkannt: {0}
SCHEMA_VERSION_ERROR = Die Schemaversion für den SQLite-Datenspeicher konnte nicht gelesen werden.
SCHEMA_UPDATE_ERROR = Beim Aktualisieren der Chest-Datensätze im SQLite-Datenspeicher während der Schemamigration ist ein Fehler aufgetreten.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} Truhenblockdatensätze wurden in das aktuelle Schema im SQLite-Datenspeicher migriert.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} Sterbetruhen-Datensätze wurden in das aktuelle Schema im SQLite-Datenspeicher migriert.

TABLE_INSERT_BLOCK_ERROR = Beim Einfügen eines Death Chest-Blocks in den SQLite-Datenspeicher ist ein Fehler aufgetreten.
TABLE_INSERT_CHEST_ERROR = Beim Einfügen einer DeathChest in den SQLite-Datenspeicher ist ein Fehler aufgetreten.

TABLE_SELECT_ALL_BLOCKS_ERROR = Beim Versuch, alle Blockdatensätze aus dem SQLite-Datenspeicher auszuwählen, ist ein Fehler aufgetreten.
TABLE_SELECT_ALL_CHESTS_ERROR = Beim Versuch, alle Truhendatensätze aus dem SQLite-Datenspeicher auszuwählen, ist ein Fehler aufgetreten.
TABLE_SELECT_CHEST_COUNT_ERROR = Beim Versuch, eine Anzahl von Truhendatensätzen aus dem SQLite-Datenspeicher abzurufen, ist ein Fehler aufgetreten.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Der Weltname „{0}“ stimmt nicht mit einer geladenen Welt auf dem Server überein. Datensatz für Migration wird übersprungen.

TABLE_DELETE_BLOCK_ERROR = Beim Versuch, einen Blockdatensatz aus dem SQLite-Datenspeicher zu löschen, ist ein Fehler aufgetreten.
TABLE_DELETE_CHEST_ERROR = Beim Versuch, einen Chest-Datensatz aus dem SQLite-Datenspeicher zu löschen, ist ein Fehler aufgetreten.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} verwaiste Truhen in Welt {1} entfernt.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Beim Versuch, verwaiste Truhen aus dem Datenspeicher zu löschen, ist ein Fehler aufgetreten.
