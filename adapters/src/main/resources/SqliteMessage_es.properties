# quotation marks: «{0}»
DATASTORE_INITIALIZE_ERROR = Se produjo un error al intentar inicializar el almacén de datos.
DATASTORE_INITIALIZE_NOTICE = Almacén de datos inicializado.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = El almacén de datos SQLite ya está inicializado.
DATASTORE_CREATE_TABLE_ERROR = Se produjo un error al crear la tabla «{0}» en el almacén de datos SQLite.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Se produjo un error al crear la tabla «chest» en el almacén de datos SQLite.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Se produjo un error al crear la tabla «block» en el almacén de datos SQLite.
DATASTORE_CLOSE_CONNECTION_ERROR = Se produjo un error al cerrar la conexión con el almacén de datos SQLite.
DATASTORE_CLOSE_CONNECTION_NOTICE = Conexión al almacén de datos SQLite cerrada.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Se produjo un error al intentar habilitar las claves externas en el almacén de datos SQLite.

SCHEMA_UP_TO_DATE_NOTICE = El esquema del almacén de datos SQLite está actualizado.
SCHEMA_VERSION_NOTICE = Versión del esquema detectada: {0}
SCHEMA_VERSION_ERROR = No se pudo leer la versión del esquema del almacén de datos SQLite.
SCHEMA_UPDATE_ERROR = Se produjo un error al actualizar los registros de Chest en el almacén de datos SQLite durante la migración del esquema.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} registros de cofres de la muerte migrados al esquema actual en el almacén de datos SQLite.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} registros de bloques de pecho migrados al esquema actual en el almacén de datos SQLite.

TABLE_INSERT_BLOCK_ERROR = Se produjo un error al insertar un bloque de cofre de la muerte en el almacén de datos SQLite.
TABLE_INSERT_CHEST_ERROR = Se produjo un error al insertar un DeathChest en el almacén de datos SQLite.

TABLE_SELECT_ALL_BLOCKS_ERROR = Se produjo un error al intentar seleccionar todos los registros de bloques del almacén de datos SQLite.
TABLE_SELECT_ALL_CHESTS_ERROR = Se produjo un error al intentar seleccionar todos los registros de cofres del almacén de datos SQLite.
TABLE_SELECT_CHEST_COUNT_ERROR = Se produjo un error al intentar recuperar el recuento de registros de cofres del almacén de datos SQLite.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = El nombre del mundo «{0}» no coincide con un mundo cargado en el servidor. Se omite el registro para la migración.

TABLE_DELETE_BLOCK_ERROR = Se produjo un error al intentar eliminar un registro de bloque del almacén de datos SQLite.
TABLE_DELETE_CHEST_ERROR = Se produjo un error al intentar eliminar un registro de cofre de la base de datos SQLite.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} cofres huérfanos en el mundo {1} eliminados.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Se produjo un error al intentar eliminar los cofres huérfanos del almacén de datos.
