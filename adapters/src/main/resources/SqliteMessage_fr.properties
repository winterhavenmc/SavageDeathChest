# quotation marks: « {0} »
DATASTORE_INITIALIZE_ERROR = Une erreur s''est produite lors de la tentative d''initialisation du magasin de données.
DATASTORE_INITIALIZE_NOTICE = Magasin de données initialisé.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = Le magasin de données SQLite est déjà initialisé.
DATASTORE_CREATE_TABLE_ERROR = Une erreur s''est produite lors de la création de la table « {0} » dans la banque de données SQLite.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Une erreur s''est produite lors de la création de la table « chest » dans la banque de données SQLite.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Une erreur s''est produite lors de la création de la table « block » dans la banque de données SQLite.
DATASTORE_CLOSE_CONNECTION_ERROR = Une erreur s''est produite lors de la fermeture de la connexion à la banque de données SQLite.
DATASTORE_CLOSE_CONNECTION_NOTICE = Connexion à la banque de données SQLite fermée.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Une erreur s''est produite lors de la tentative d''activation des clés étrangères dans la banque de données SQLite.

SCHEMA_UP_TO_DATE_NOTICE = Le schéma du magasin de données SQLite est à jour.
SCHEMA_VERSION_NOTICE = Version du schéma détectée : {0}
SCHEMA_VERSION_ERROR = Impossible de lire la version du schéma pour la banque de données SQLite.
SCHEMA_UPDATE_ERROR = Une erreur s''est produite lors de la mise à jour des enregistrements de coffre dans la banque de données SQLite pendant la migration du schéma.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} enregistrements de coffre de mort migrés vers le schéma actuel dans la banque de données SQLite.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} enregistrements de blocs de coffre migrés vers le schéma actuel dans la banque de données SQLite.

TABLE_INSERT_BLOCK_ERROR = Une erreur s''est produite lors de l''insertion d'un bloc de coffre de mort dans la banque de données SQLite.
TABLE_INSERT_CHEST_ERROR = Une erreur s''est produite lors de l''insertion d''un DeathChest dans la banque de données SQLite.

TABLE_SELECT_ALL_BLOCKS_ERROR = Une erreur s''est produite lors de la tentative de sélection de tous les enregistrements de bloc à partir de la banque de données SQLite.
TABLE_SELECT_ALL_CHESTS_ERROR = Une erreur s''est produite lors de la tentative de sélection de tous les enregistrements de coffre à partir de la banque de données SQLite.
TABLE_SELECT_CHEST_COUNT_ERROR = Une erreur s''est produite lors de la tentative de récupération d''un nombre d''enregistrements de coffre à partir de la banque de données SQLite.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Le nom du monde « {0} » ne correspond pas à un monde chargé sur le serveur. Enregistrement ignoré pour la migration.

TABLE_DELETE_BLOCK_ERROR = Une erreur s''est produite lors de la tentative de suppression d''un enregistrement de bloc de la banque de données SQLite.
TABLE_DELETE_CHEST_ERROR = Une erreur s''est produite lors de la tentative de suppression d''un enregistrement de coffre de la banque de données SQLite.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} coffres orphelins du monde {1} supprimés.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Une erreur s''est produite lors de la tentative de suppression des coffres orphelins de la banque de données.
