# quotation marks: 「{0}」
DATASTORE_INITIALIZE_ERROR = データストアの初期化中にエラーが発生しました。
DATASTORE_INITIALIZE_NOTICE = データストアは初期化されました。
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = SQLite データストアは既に初期化されています。
DATASTORE_CREATE_TABLE_ERROR = SQLite データストアに 「{0}」 テーブルを作成中にエラーが発生しました。
DATASTORE_CREATE_CHEST_TABLE_ERROR = SQLite データストアに 「chest」 テーブルを作成中にエラーが発生しました。
DATASTORE_CREATE_BLOCK_TABLE_ERROR = SQLite データストアに 「block」 テーブルを作成中にエラーが発生しました。
DATASTORE_CLOSE_CONNECTION_ERROR = SQLite データストア接続の終了中にエラーが発生しました。
DATASTORE_CLOSE_CONNECTION_NOTICE = SQLite データストア接続が閉じられました。

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = SQLite データストアで外部キーを有効にしようとした際にエラーが発生しました。

SCHEMA_UP_TO_DATE_NOTICE = SQLite データストアのスキーマは最新です。
SCHEMA_VERSION_NOTICE = 検出されたスキーマバージョン: {0}
SCHEMA_VERSION_ERROR = SQLite データストアのスキーマバージョンを読み取ることができませんでした。
SCHEMA_UPDATE_ERROR = スキーマ移行中に SQLite データストアのチェストレコードを更新中にエラーが発生しました。
SCHEMA_CHESTS_MIGRATED_NOTICE = デスチェストレコード {0} 件が SQLite データストアの現在のスキーマに移行されました。
SCHEMA_BLOCKS_MIGRATED_NOTICE = チェストブロックレコード {0} 件が SQLite データストアの現在のスキーマに移行されました。

TABLE_INSERT_BLOCK_ERROR = SQLite データストアにデスチェストブロックを挿入中にエラーが発生しました。
TABLE_INSERT_CHEST_ERROR = SQLite データストアにデスチェストを挿入中にエラーが発生しました。

TABLE_SELECT_ALL_BLOCKS_ERROR = SQLite データストアからすべてのブロックレコードを選択中にエラーが発生しました。
TABLE_SELECT_ALL_CHESTS_ERROR = SQLite データストアからすべてのチェストレコードを選択中にエラーが発生しました。
TABLE_SELECT_CHEST_COUNT_ERROR = SQLite データストアからチェストレコードの数を取得中にエラーが発生しました。
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = ワールド名 「{0}」 はサーバー上にロードされているワールドと一致しません。移行のためにレコードをスキップします。

TABLE_DELETE_BLOCK_ERROR = SQLite データストアからブロックレコードを削除中にエラーが発生しました。
TABLE_DELETE_CHEST_ERROR = SQLite データストアからチェストレコードを削除中にエラーが発生しました。
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = ワールド {1} 内の孤立したチェスト {0} 個が削除されました。
TABLE_DELETE_ORPHANED_CHESTS_ERROR = データストアから孤立したチェストを削除中にエラーが発生しました。
