# quotation marks:“{0}”
DATASTORE_INITIALIZE_ERROR = Er is een fout opgetreden bij het initialiseren van de datastore.
DATASTORE_INITIALIZE_NOTICE = Datastore geïnitialiseerd.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = De SQLite-datastore is al geïnitialiseerd.
DATASTORE_CREATE_TABLE_ERROR = Er is een fout opgetreden bij het aanmaken van tabel “{0}” in de Sqlite-datastore.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Er is een fout opgetreden bij het aanmaken van tabel “chest” in de Sqlite-datastore.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Er is een fout opgetreden bij het aanmaken van tabel “block” in de Sqlite-datastore.
DATASTORE_CLOSE_CONNECTION_ERROR = Er is een fout opgetreden bij het sluiten van de SQLite-datastoreverbinding.
DATASTORE_CLOSE_CONNECTION_NOTICE = Verbinding met SQLite-datastore verbroken.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Er is een fout opgetreden bij het inschakelen van externe sleutels in de SQLite-datastore.

SCHEMA_UP_TO_DATE_NOTICE = Het schema van de SQLite-datastore is up-to-date.
SCHEMA_VERSION_NOTICE = Schemaversie gedetecteerd: {0}
SCHEMA_VERSION_ERROR = Kon schemaversie voor de SQLite-datastore niet lezen.
SCHEMA_UPDATE_ERROR = Er is een fout opgetreden bij het bijwerken van kistrecords in de SQLite-datastore tijdens de schemamigratie.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} records van de overlijdenskist zijn gemigreerd naar het huidige schema in de SQLite-datastore.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} records van de kistblok zijn gemigreerd naar het huidige schema in de SQLite-datastore.

TABLE_INSERT_BLOCK_ERROR = Er is een fout opgetreden bij het invoegen van een death chest-blok in de SQLite-datastore.
TABLE_INSERT_CHEST_ERROR = Er is een fout opgetreden bij het invoegen van een Death Chest in de SQLite-datastore.

TABLE_SELECT_ALL_BLOCKS_ERROR = Er is een fout opgetreden bij het selecteren van alle blokrecords uit de SQLite-datastore.
TABLE_SELECT_ALL_CHESTS_ERROR = Er is een fout opgetreden bij het selecteren van alle kistrecords uit de SQLite-datastore.
TABLE_SELECT_CHEST_COUNT_ERROR = Er is een fout opgetreden bij het ophalen van een telling van kistrecords uit de SQLite-datastore.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Wereldnaam “{0}” komt niet overeen met een geladen wereld op de server. Record voor migratie wordt overgeslagen.

TABLE_DELETE_BLOCK_ERROR = Er is een fout opgetreden bij het verwijderen van een blokrecord uit de SQLite-datastore.
TABLE_DELETE_CHEST_ERROR = Er is een fout opgetreden bij het verwijderen van een kistrecord uit de SQLite-datastore.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} verweesde kisten in wereld {1} verwijderd.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Er is een fout opgetreden bij het verwijderen van verweesde kisten uit de datastore.
