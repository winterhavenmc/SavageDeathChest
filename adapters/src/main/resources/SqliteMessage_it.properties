# quotation marks «{0}»
DATASTORE_INITIALIZE_ERROR = Si è verificato un errore durante il tentativo di inizializzazione del datastore.
DATASTORE_INITIALIZE_NOTICE = Datastore inizializzato.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = Il datastore SQLite è già inizializzato.
DATASTORE_CREATE_TABLE_ERROR = Si è verificato un errore durante la creazione della tabella «{0}» nel datastore SQLite.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Si è verificato un errore durante la creazione della tabella «chest» nel datastore SQLite.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Si è verificato un errore durante la creazione della tabella «block» nel datastore SQLite.
DATASTORE_CLOSE_CONNECTION_ERROR = Si è verificato un errore durante la chiusura della connessione al datastore SQLite.
DATASTORE_CLOSE_CONNECTION_NOTICE = Connessione al datastore SQLite chiusa.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Si è verificato un errore durante il tentativo di abilitare le chiavi esterne nel datastore SQLite.

SCHEMA_UP_TO_DATE_NOTICE = Lo schema del datastore SQLite è aggiornato.
SCHEMA_VERSION_NOTICE = Versione schema rilevata: {0}
SCHEMA_VERSION_ERROR = Impossibile leggere la versione schema per il datastore SQLite.
SCHEMA_UPDATE_ERROR = Si è verificato un errore durante l’aggiornamento dei record del baule nel datastore SQLite durante la migrazione dello schema.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} record del baule dei decessi sono stati migrati allo schema corrente nel datastore SQLite.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} record del blocco del baule dei decessi sono stati migrati allo schema corrente nel datastore SQLite.

TABLE_INSERT_BLOCK_ERROR = Si è verificato un errore durante l’inserimento di un blocco del baule dei decessi nel datastore SQLite.
TABLE_INSERT_CHEST_ERROR = Si è verificato un errore durante l’inserimento di un forziere della morte nel datastore SQLite.

TABLE_SELECT_ALL_BLOCKS_ERROR = Si è verificato un errore durante il tentativo di selezionare tutti i record di blocco dal datastore SQLite.
TABLE_SELECT_ALL_CHESTS_ERROR = Si è verificato un errore durante il tentativo di selezionare tutti i record di forziere dal datastore SQLite.
TABLE_SELECT_CHEST_COUNT_ERROR = Si è verificato un errore durante il tentativo di recuperare un conteggio dei record di forziere dal datastore SQLite.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Il nome del mondo «{0}» non corrisponde a un mondo caricato sul server. Il record verrà ignorato per la migrazione.

TABLE_DELETE_BLOCK_ERROR = Si è verificato un errore durante il tentativo di eliminare un record di blocco dal datastore SQLite.
TABLE_DELETE_CHEST_ERROR = Si è verificato un errore durante il tentativo di eliminare un record di forziere dal datastore SQLite.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} forzieri orfani nel mondo {1} rimossi.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Si è verificato un errore durante il tentativo di eliminare i forzieri orfani dal datastore.
