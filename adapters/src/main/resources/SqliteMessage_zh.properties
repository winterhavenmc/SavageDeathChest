# quotation marks: “{0}”
DATASTORE_INITIALIZE_ERROR = 初始化数据存储时发生错误。
DATASTORE_INITIALIZE_NOTICE = 数据存储已初始化。
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = SQLite 数据存储已初始化。
DATASTORE_CREATE_TABLE_ERROR = 在 SQLite 数据存储中创建表“{0}”时发生错误。
DATASTORE_CREATE_CHEST_TABLE_ERROR = 在 SQLite 数据存储中创建表“chest”时发生错误。
DATASTORE_CREATE_BLOCK_TABLE_ERROR = 在 SQLite 数据存储中创建表“block”时发生错误。
DATASTORE_CLOSE_CONNECTION_ERROR = 关闭 SQLite 数据存储连接时发生错误。
DATASTORE_CLOSE_CONNECTION_NOTICE = SQLite 数据存储连接已关闭。

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = 尝试在 SQLite 数据存储中启用外键时发生错误。

SCHEMA_UP_TO_DATE_NOTICE = SQLite 数据存储模式已是最新版本。
SCHEMA_VERSION_NOTICE = 检测到的模式版本：{0}
SCHEMA_VERSION_ERROR = 无法读取 SQLite 数据存储的模式版本。
SCHEMA_UPDATE_ERROR = 在模式迁移期间更新 SQLite 数据存储中的箱子记录时发生错误。
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} 条死亡箱子记录已迁移到 SQLite 数据存储中的当前模式。
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} 条箱子块记录已迁移到 SQLite 数据存储中的当前模式。

TABLE_INSERT_BLOCK_ERROR = 将死亡宝箱方块插入 SQLite 数据存储时出错。
TABLE_INSERT_CHEST_ERROR = 将死亡宝箱插入 SQLite 数据存储时出错。

TABLE_SELECT_ALL_BLOCKS_ERROR = 尝试从 SQLite 数据存储中选择所有方块记录时出错。
TABLE_SELECT_ALL_CHESTS_ERROR = 尝试从 SQLite 数据存储中选择所有宝箱记录时出错。
TABLE_SELECT_CHEST_COUNT_ERROR = 尝试从 SQLite 数据存储中检索宝箱记录计数时出错。
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = 世界名称“{0}”与服务器上已加载的世界不匹配。跳过此记录进行迁移。

TABLE_DELETE_BLOCK_ERROR = 尝试从 SQLite 数据存储中删除区块记录时发生错误。
TABLE_DELETE_CHEST_ERROR = 尝试从 SQLite 数据存储中删除箱子记录时发生错误。
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = 世界 {1} 中的 {0} 个孤立箱子已移除。
TABLE_DELETE_ORPHANED_CHESTS_ERROR = 尝试从数据存储中删除孤立箱子时发生错误。
