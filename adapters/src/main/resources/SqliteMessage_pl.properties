# quotation marks: „{0}”
DATASTORE_INITIALIZE_ERROR = Wystąpił błąd podczas próby zainicjowania magazynu danych.
DATASTORE_INITIALIZE_NOTICE = Magazyn danych został zainicjowany.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = Magazyn danych SQLite został już zainicjowany.
DATASTORE_CREATE_TABLE_ERROR = Wystąpił błąd podczas tworzenia tabeli „{0}” w magazynie danych Sqlite.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Wystąpił błąd podczas tworzenia tabeli „chest” w magazynie danych Sqlite.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Wystąpił błąd podczas tworzenia tabeli „block” w magazynie danych Sqlite.
DATASTORE_CLOSE_CONNECTION_ERROR = Wystąpił błąd podczas zamykania połączenia z magazynem danych SQLite.
DATASTORE_CLOSE_CONNECTION_NOTICE = Połączenie z bazą danych SQLite zostało zamknięte.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Wystąpił błąd podczas próby włączenia kluczy obcych w bazie danych SQLite.

SCHEMA_UP_TO_DATE_NOTICE = Schemat bazy danych SQLite jest aktualny.
SCHEMA_VERSION_NOTICE = Wykryto wersję schematu: {0}
SCHEMA_VERSION_ERROR = Nie można odczytać wersji schematu dla bazy danych SQLite.
SCHEMA_UPDATE_ERROR = Wystąpił błąd podczas aktualizacji rekordów skrzynki w bazie danych SQLite podczas migracji schematu.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} rekordów skrzynki śmierci zostało zmigrowanych do bieżącego schematu w bazie danych SQLite.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} rekordów bloków skrzynki zostało zmigrowanych do bieżącego schematu w bazie danych SQLite.

TABLE_INSERT_BLOCK_ERROR = Wystąpił błąd podczas wstawiania bloku skrzyni śmierci do magazynu danych SQLite.
TABLE_INSERT_CHEST_ERROR = Wystąpił błąd podczas wstawiania skrzyni śmierci do magazynu danych SQLite.

TABLE_SELECT_ALL_BLOCKS_ERROR = Wystąpił błąd podczas próby wybrania wszystkich rekordów bloku z magazynu danych SQLite.
TABLE_SELECT_ALL_CHESTS_ERROR = Wystąpił błąd podczas próby wybrania wszystkich rekordów skrzyni z magazynu danych SQLite.
TABLE_SELECT_CHEST_COUNT_ERROR = Wystąpił błąd podczas próby pobrania liczby rekordów skrzyni z magazynu danych SQLite.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Nazwa świata „{0}” nie pasuje do załadowanego świata na serwerze. Rekord pomijany podczas migracji.

TABLE_DELETE_BLOCK_ERROR = Wystąpił błąd podczas próby usunięcia rekordu bloku z magazynu danych SQLite.
TABLE_DELETE_CHEST_ERROR = Wystąpił błąd podczas próby usunięcia rekordu skrzyni z magazynu danych SQLite.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = Usunięto {0} osieroconych skrzyń w świecie {1}.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Wystąpił błąd podczas próby usunięcia osieroconych skrzyń z magazynu danych.
