# quotation marks: „{0}“
DATASTORE_INITIALIZE_ERROR = Villa kom upp við að frumstilla gagnageymsluna.
DATASTORE_INITIALIZE_NOTICE = Gagnageymslunni var frumstillt.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = SQLite gagnageymslunni er þegar frumstillt.
DATASTORE_CREATE_TABLE_ERROR = Villa kom upp við að búa til töfluna „{0}“ í Sqlite gagnageymslunni.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Villa kom upp við að búa til töfluna „chest“ í Sqlite gagnageymslunni.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Villa kom upp við að búa til töfluna „block“ í Sqlite gagnageymslunni.
DATASTORE_CLOSE_CONNECTION_ERROR = Villa kom upp við að loka tengingu við SQLite gagnageymsluna.
DATASTORE_CLOSE_CONNECTION_NOTICE = Tenging við SQLite gagnageymsluna var lokuð.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Villa kom upp við tilraun til að virkja erlenda lykla í SQLite gagnageymslunni.

SCHEMA_UP_TO_DATE_NOTICE = Skema SQLite gagnageymslunnar er uppfært.
SCHEMA_VERSION_NOTICE = Skemaútgáfa greind: {0}
SCHEMA_VERSION_ERROR = Gat ekki lesið skemaútgáfu fyrir SQLite gagnageymsluna.
SCHEMA_UPDATE_ERROR = Villa kom upp við uppfærslu á kassafærslum í SQLite gagnageymslunni við flutning skemas.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} dauðakassafærslur fluttar í núverandi skema í SQLite gagnageymslunni.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} kassablokkfærslur fluttar í núverandi skema í SQLite gagnageymslunni.

TABLE_INSERT_BLOCK_ERROR = Villa kom upp við að setja dauðakassablokk inn í SQLite gagnageymsluna.
TABLE_INSERT_CHEST_ERROR = Villa kom upp við að setja DeathChest inn í SQLite gagnageymsluna.

TABLE_SELECT_ALL_BLOCKS_ERROR = Villa kom upp við að reyna að velja allar blokkfærslur úr SQLite gagnageymslunni.
TABLE_SELECT_ALL_CHESTS_ERROR = Villa kom upp við að reyna að velja allar kistufærslur úr SQLite gagnageymslunni.
TABLE_SELECT_CHEST_COUNT_ERROR = Villa kom upp við að reyna að sækja fjölda kistufærslna úr SQLite gagnageymslunni.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Heimsheiti „{0}“ passar ekki við hlaðinn heim á netþjóninum. Sleppir færslu fyrir flutning.

TABLE_DELETE_BLOCK_ERROR = Villa kom upp við að reyna að eyða blokkfærslu úr SQLite gagnageymslunni.
TABLE_DELETE_CHEST_ERROR = Villa kom upp við að reyna að eyða kistufærslu úr SQLite gagnageymslunni.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = {0} munaðarlausar kistur í heiminum {1} fjarlægðar.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Villa kom upp við tilraun til að eyða munaðarlausum kistum úr gagnageymslunni.
