# quotation marks: «{0}»
DATASTORE_INITIALIZE_ERROR = Сталася помилка під час спроби ініціалізації сховища даних.
DATASTORE_INITIALIZE_NOTICE = Сховище даних ініціалізовано.
DATASTORE_INITIALIZED_PREVIOUSLY_NOTICE = Сховище даних SQLite вже ініціалізовано.
DATASTORE_CREATE_TABLE_ERROR = Сталася помилка під час створення таблиці «{0}» у сховищі даних Sqlite.
DATASTORE_CREATE_CHEST_TABLE_ERROR = Сталася помилка під час створення таблиці «chest» у сховищі даних Sqlite.
DATASTORE_CREATE_BLOCK_TABLE_ERROR = Сталася помилка під час створення таблиці «block» у сховищі даних Sqlite.
DATASTORE_CLOSE_CONNECTION_ERROR = Сталася помилка під час закриття з'єднання зі сховищем даних SQLite.
DATASTORE_CLOSE_CONNECTION_NOTICE = З'єднання зі сховищем даних SQLite закрито.

PRAGMA_ENABLE_FOREIGN_KEYS_ERROR = Сталася помилка під час спроби ввімкнути зовнішні ключі у сховищі даних SQLite.

SCHEMA_UP_TO_DATE_NOTICE = Схема сховища даних SQLite оновлена.
SCHEMA_VERSION_NOTICE = Виявлено версію схеми: {0}
SCHEMA_VERSION_ERROR = Не вдалося прочитати версію схеми для сховища даних SQLite.
SCHEMA_UPDATE_ERROR = Сталася помилка під час оновлення записів скринь у сховищі даних SQLite під час міграції схеми.
SCHEMA_CHESTS_MIGRATED_NOTICE = {0} записів скринь смерті перенесено до поточної схеми у сховищі даних SQLite.
SCHEMA_BLOCKS_MIGRATED_NOTICE = {0} записів блоків скринь смерті перенесено до поточної схеми у сховищі даних SQLite.

TABLE_INSERT_BLOCK_ERROR = Сталася помилка під час вставки блоку скрині смерті у сховище даних SQLite.
TABLE_INSERT_CHEST_ERROR = Сталася помилка під час вставки скрині смерті до сховища даних SQLite.

TABLE_SELECT_ALL_BLOCKS_ERROR = Сталася помилка під час спроби вибрати всі записи блоків зі сховища даних SQLite.
TABLE_SELECT_ALL_CHESTS_ERROR = Сталася помилка під час спроби вибрати всі записи скринь зі сховища даних SQLite.
TABLE_SELECT_CHEST_COUNT_ERROR = Сталася помилка під час спроби отримати кількість записів скринь зі сховища даних SQLite.
TABLE_SELECT_CHEST_WORLD_NOT_LOADED_ERROR = Назва світу «{0}» не відповідає завантаженому світу на сервері. Пропускається запис для міграції.

TABLE_DELETE_BLOCK_ERROR = Сталася помилка під час спроби видалити запис блоку зі сховища даних SQLite.
TABLE_DELETE_CHEST_ERROR = Сталася помилка під час спроби видалити запис скрині зі сховища даних SQLite.
TABLE_DELETE_ORPHANED_CHESTS_NOTICE = Видалено {0} осиротілих скринь у світі {1}.
TABLE_DELETE_ORPHANED_CHESTS_ERROR = Сталася помилка під час спроби видалити осиротілі скрині зі сховища даних.
