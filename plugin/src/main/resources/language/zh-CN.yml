# Language configuration file for SavageDeathChest v2.0.0

# constant strings
CONSTANTS:
  TIME:
    LESS_THAN: "少于 {DURATION}"
    UNLIMITED: "不限时"

  CHEST_INFO:
    # Custom chest inventory name
    INVENTORY_NAME: "死亡宝箱"


# Message placeholders:
# {RECIPIENT}                        Name of message recipient
# {RECIPIENT.LOCATION}               Location of message recipient, if in game player.
# {RECIPIENT.LOCATION.WORLD}         World name of Recipient (player) location
# {RECIPIENT.LOCATION.X}             Recipient (player) X coordinate
# {RECIPIENT.LOCATION.Y}             Recipient (player) Y coordinate
# {RECIPIENT.LOCATION.Z}             Recipient (player) Z coordinate
# {DEATH_CHEST} subfields:
# {DEATH_CHEST.OWNER}                Chest owner name (only available in messages that reference a valid chest object)
# {DEATH_CHEST.LOOTER}               Chest looter name (only available in messages that reference a valid chest object)
# {DEATH_CHEST.LOCATION}             Chest location formatted: world [x, y, z]
# {DEATH_CHEST.LOCATION.WORLD}       World name of chest
# {DEATH_CHEST.LOCATION.X}           Chest coordinates
# {DEATH_CHEST.LOCATION.Y}           Chest coordinates
# {DEATH_CHEST.LOCATION.Z}           Chest coordinates
# {DEATH_CHEST.EXPIRATION.DURATION}  Time remaining until chest expires and drops contents
# {DEATH_CHEST.EXPIRATION.INSTANT}   Date/time when chest expires and drops contents
# {DEATH_CHEST.PROTECTION.DURATION}  Remaining time before non-owners may access chest contents
# {DEATH_CHEST.PROTECTION.INSTANT}   Date/time when non-owners may access chest contents
# {PLUGIN}                           Protection plugin name

# List placeholders:
# {PAGE_NUMBER}   List page number (only available in LIST_HEADER and LIST_FOOTER messages)
# {PAGE_TOTAL}    List total page count (only available in LIST_HEADER and LIST_FOOTER messages)
# {ITEM_NUMBER}   List item number (only available in list item messages)


# Message Fields:
# MESSAGE_KEY: the unique identifier for each individual message, represented by an enum constant in code
#   MESSAGE_TEXT: string value that will be displayed as a chat message, may be omitted
#   TITILE_TEXT: string value that will be displayed as a title, may be omitted
#   SUBTITLE_TEXT: string value that will be displayed as a subtitle, may be omitted
#   ENABLED: boolean value determines whether any of the message text fields will be displayed, defaults to true if omitted
#   REPEAT_DELAY: integer value representing the number of seconds to wait before sending a message to a given player again
#   TITLE_FADE_IN, TITLE_STAY, TITLE_FADE_OUT: integer values to override the default title fade timings (in ticks)


#################
# Custom Messages
#################

MESSAGES:
  CHEST_SUCCESS:
    MESSAGE_TEXT: "<green>成功地放置了死亡箱. 你有 {EXPIRATION_DURATION} 来取回你的物品.</green>"

  DOUBLECHEST_PARTIAL_SUCCESS:
    MESSAGE_TEXT: "<red>在你的死亡地点只能放置单个箱子. 一些物品已掉落.</red>"

  CHEST_DEPLOYED_PROTECTION_TIME:
    MESSAGE_TEXT: "<red>死亡宝箱在 {PROTECTION_DURATION} 内不会被掠夺.</red>"

  CHEST_ACCESSED_PROTECTION_TIME:
    repeat-delay: 1
    MESSAGE_TEXT: "<red>属于 {OWNER} 的死亡宝箱在 {PROTECTION_DURATION} 内不会被抢劫.</red>"

  CHEST_DENIED_PLUGIN:
    MESSAGE_TEXT: "<red>死亡箱的部署被 {PLUGIN} 阻止了.</red>"

  CHEST_DENIED_DEPLOYMENT_BY_PLUGIN:
    MESSAGE_TEXT: "<red>死亡箱的部署被 {PLUGIN} 阻止了.</red>"

  CHEST_DENIED_ACCESS_BY_PLUGIN:
    MESSAGE_TEXT: "<red>{PLUGIN} 阻止了对死亡宝箱的访问.</red>"

  CHEST_DENIED_BLOCK:
    MESSAGE_TEXT: "<red>找不到一个来放置箱子的开放空间.</red>"

  CHEST_DENIED_PERMISSION:
    ENABLED: false
    MESSAGE_TEXT: "<red>你没有死亡箱的权限.</red>"

  CHEST_DENIED_ADJACENT:
    MESSAGE_TEXT: "<red>死亡箱的部署被一个已知的相邻箱子阻止了.</red>"

  CHEST_DENIED_SPAWN_RADIUS:
    MESSAGE_TEXT: "<red>死亡箱的部署被世界出生点保护阻止了.</red>"

  CHEST_DENIED_WORLD_DISABLED:
    MESSAGE_TEXT: "<red>死亡箱没有在该世界启用.</red>"

  CHEST_DENIED_VOID:
    MESSAGE_TEXT: "<red>死亡箱无法部署在虚空中.</red>"


  INVENTORY_EMPTY:
    MESSAGE_TEXT: "<red>你没有背包可放在死亡箱中.</red>"

  INVENTORY_FULL:
    MESSAGE_TEXT: "<red>因为你的背包满了 一些物品无法被转移.</red>"

  NO_CHEST_IN_INVENTORY:
    MESSAGE_TEXT: "<red>你的背包中没有任何箱子.</red>"

  NOT_OWNER:
    MESSAGE_TEXT: "<red>那个死亡箱不属于你.</red>"

  CHEST_EXPIRED:
    MESSAGE_TEXT: "<red>你的死亡箱已过期.</red>"
    repeat-delay: 1

  CREATIVE_MODE:
    MESSAGE_TEXT: "<red>创造模式背包没有保存在死亡箱中.</red>"


  NO_CREATIVE_ACCESS:
    MESSAGE_TEXT: "<red>在创造模式下打开死亡箱是不允许的.</red>"

  CHEST_CURRENTLY_OPEN:
    MESSAGE_TEXT: "<red>死亡箱当前已被其他玩家打开.</red>"


  COMMAND_INVALID:
    MESSAGE_TEXT: "<red>那不是一个有效的命令!</red>"

  COMMAND_FAIL_ARGS_COUNT_OVER:
    MESSAGE_TEXT: "<red>参数过多!</red>"

  COMMAND_FAIL_HELP_PERMISSION:
    MESSAGE_TEXT: "<red>你没有权限来显示 DeathChest 帮助!</red>"

  COMMAND_FAIL_LIST_PERMISSION:
    MESSAGE_TEXT: "<red>你没有权限来列出死亡箱!</red>"

  COMMAND_FAIL_LIST_OTHER_PERMISSION:
    MESSAGE_TEXT: "<red>你没有权限来列出其他玩家的死亡箱!</red>"

  COMMAND_FAIL_RELOAD_PERMISSION:
    MESSAGE_TEXT: "<red>你没有权限来重载 DeathChest 配置!</red>"

  COMMAND_FAIL_STATUS_PERMISSION:
    MESSAGE_TEXT: "<red>你没有权限来查看 DeathChest 设定!</red>"

  COMMAND_SUCCESS_RELOAD:
    MESSAGE_TEXT: "<gray>DeathChest 配置已重载.</gray>"
