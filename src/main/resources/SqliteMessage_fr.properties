SELECT_ALL_CHESTS_ERROR = Une erreur s'est produite lors de la tentative de sélection de tous les enregistrements de coffre à partir de la banque de données SQLite.
INSERT_CHEST_ERROR = Une erreur s'est produite lors de l'insertion d'un DeathChest dans la banque de données SQLite.
DELETE_CHEST_ERROR = Une erreur s'est produite lors de la tentative de suppression d'un enregistrement de coffre de la banque de données SQLite.
GET_CHEST_COUNT_ERROR = Une erreur s'est produite lors de la tentative de récupération d'un nombre d'enregistrements de coffre à partir de la banque de données SQLite.
DELETE_ORPHANED_CHESTS_ERROR = Une erreur s'est produite lors de la tentative de suppression des coffres orphelins de la banque de données.
SELECT_ALL_BLOCKS_ERROR = Une erreur s'est produite lors de la tentative de sélection de tous les enregistrements de bloc à partir de la banque de données SQLite.
INSERT_BLOCK_ERROR = Une erreur s'est produite lors de l'insertion d'un bloc de coffre de mort dans la banque de données SQLite.
DELETE_BLOCK_ERROR = Une erreur s'est produite lors de la tentative de suppression d'un enregistrement de bloc de la banque de données SQLite.
CLOSE_DATASTORE_ERROR = Une erreur s'est produite lors de la fermeture de la connexion à la banque de données SQLite.
NO_SCHEMA_VERSION_ERROR = Impossible de lire la version du schéma pour la banque de données SQLite.
ENABLE_FOREIGN_KEYS_ERROR = Une erreur s'est produite lors de la tentative d'activation des clés étrangères dans la banque de données SQLIte.
SCHEMA_UPDATE_ERROR = Une erreur s'est produite lors de la mise à jour des enregistrements de coffre dans la banque de données SQLite pendant la migration du schéma.
ALREADY_INITIALIZED_NOTICE = Le magasin de données SQLite est déjà initialisé.
SCHEMA_UP_TO_DATE_NOTICE = Le schéma du magasin de données SQLite est à jour.
CONNECTION_CLOSED_NOTICE = Connexion à la banque de données SQLite fermée.
