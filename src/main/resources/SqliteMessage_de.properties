INITIALIZE_DATASTORE_ERROR = Beim Versuch, den Datenspeicher zu initialisieren, ist ein Fehler aufgetreten.
CREATE_CHEST_TABLE_ERROR = Beim Erstellen der Tabelle „Chest“ im SQLite-Datenspeicher ist ein Fehler aufgetreten.
CREATE_BLOCK_TABLE_ERROR = Beim Erstellen der Tabelle „Block“ im SQLite-Datenspeicher ist ein Fehler aufgetreten.
SELECT_ALL_CHESTS_ERROR = Beim Versuch, alle Truhendatensätze aus dem SQLite-Datenspeicher auszuwählen, ist ein Fehler aufgetreten.
INSERT_CHEST_ERROR = Beim Einfügen einer DeathChest in den SQLite-Datenspeicher ist ein Fehler aufgetreten.
DELETE_CHEST_ERROR = Beim Versuch, einen Chest-Datensatz aus dem SQLite-Datenspeicher zu löschen, ist ein Fehler aufgetreten.
GET_CHEST_COUNT_ERROR = Beim Versuch, eine Anzahl von Truhendatensätzen aus dem SQLite-Datenspeicher abzurufen, ist ein Fehler aufgetreten.
DELETE_ORPHANED_CHESTS_ERROR = Beim Versuch, verwaiste Truhen aus dem Datenspeicher zu löschen, ist ein Fehler aufgetreten.
SELECT_ALL_BLOCKS_ERROR = Beim Versuch, alle Blockdatensätze aus dem SQLite-Datenspeicher auszuwählen, ist ein Fehler aufgetreten.
INSERT_BLOCK_ERROR = Beim Einfügen eines Death Chest-Blocks in den SQLite-Datenspeicher ist ein Fehler aufgetreten.
DELETE_BLOCK_ERROR = Beim Versuch, einen Blockdatensatz aus dem SQLite-Datenspeicher zu löschen, ist ein Fehler aufgetreten.
CLOSE_DATASTORE_ERROR = Beim Schließen der SQLite-Datenspeicherverbindung ist ein Fehler aufgetreten.
NO_SCHEMA_VERSION_ERROR = Die Schemaversion für den SQLite-Datenspeicher konnte nicht gelesen werden.
ENABLE_FOREIGN_KEYS_ERROR = Beim Versuch, Fremdschlüssel im SQLIte-Datenspeicher zu aktivieren, ist ein Fehler aufgetreten.
SCHEMA_UPDATE_ERROR = Beim Aktualisieren der Chest-Datensätze im SQLite-Datenspeicher während der Schemamigration ist ein Fehler aufgetreten.
ALREADY_INITIALIZED_NOTICE = Der SQLite-Datenspeicher ist bereits initialisiert.
SCHEMA_UP_TO_DATE_NOTICE = Das SQLite-Datenspeicherschema ist auf dem neuesten Stand.
CONNECTION_CLOSED_NOTICE = SQLite-Datenspeicherverbindung geschlossen.
