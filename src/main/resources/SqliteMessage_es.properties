INITIALIZE_DATASTORE_NOTICE = Almacén de datos inicializado.
INITIALIZE_DATASTORE_ERROR = Se produjo un error al intentar inicializar el almacén de datos.
CREATE_CHEST_TABLE_ERROR = Se produjo un error al crear la tabla ''chest'' en el almacén de datos SQLite.
CREATE_BLOCK_TABLE_ERROR = Se produjo un error al crear la tabla ''block'' en el almacén de datos SQLite.
SELECT_ALL_CHESTS_ERROR = Se produjo un error al intentar seleccionar todos los registros de cofre del almacén de datos SQLite.
INSERT_CHEST_ERROR = Se produjo un error al insertar un DeathChest en el almacén de datos de SQLite.
DELETE_CHEST_ERROR = Se produjo un error al intentar eliminar un registro de cofre del almacén de datos SQLite.
GET_CHEST_COUNT_ERROR = Se produjo un error al intentar recuperar un recuento de registros de cofres del almacén de datos SQLite.
DELETE_ORPHANED_CHESTS_NOTICE = Se eliminaron {0} cofres huérfanos en el mundo {1}.
DELETE_ORPHANED_CHESTS_ERROR = Se produjo un error al intentar eliminar cofres huérfanos del almacén de datos.
SELECT_ALL_BLOCKS_ERROR = Se produjo un error al intentar seleccionar todos los registros de bloques del almacén de datos SQLite.
INSERT_BLOCK_ERROR = Se produjo un error al insertar un bloque de cofre de la muerte en el almacén de datos de SQLite.
DELETE_BLOCK_ERROR = Se produjo un error al intentar eliminar un registro de bloque del almacén de datos SQLite.
CLOSE_DATASTORE_ERROR = Se produjo un error al cerrar la conexión del almacén de datos SQLite.
SCHEMA_VERSION_NOTICE = Versión del esquema detectada: {0}
SCHEMA_VERSION_ERROR = No se pudo leer la versión del esquema del almacén de datos SQLite.
SCHEMA_UPDATE_ERROR = Se produjo un error al actualizar los registros del cofre en el almacén de datos SQLite durante la migración del esquema.
SCHEMA_CHESTS_MIGRATED_NOTICE = Se migraron {0} registros de cofres de muerte al esquema actual en el almacén de datos SQLite.
