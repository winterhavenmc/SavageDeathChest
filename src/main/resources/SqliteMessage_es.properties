ENABLE_FOREIGN_KEYS_ERROR = Se produjo un error al intentar habilitar claves externas en el almacén de datos SQLite.
ALREADY_INITIALIZED_NOTICE = El almacén de datos SQLite ya está inicializado.
SCHEMA_UP_TO_DATE_NOTICE = El esquema del almacén de datos SQLite está actualizado.
CONNECTION_CLOSED_NOTICE = Conexión al almacén de datos SQLite cerrada.
